# Construit l'export statique Next.js et le publie sur GitHub Pages.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Autorisations nécessaires au déploiement Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build (export statique)
        env:
          # Dépôt de projet : le site vit sous /<nom-du-dépôt>.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
